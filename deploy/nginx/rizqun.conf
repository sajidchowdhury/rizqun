# Nginx configuration for Rizqun API
#
# This config:
#   1. Redirects all HTTP → HTTPS
#   2. Serves the frontend static build on /
#   3. Proxies /auth, /vendors, /products, /orders, /ratings, /users,
#      /categories, /dashboard, /health to the Node.js backend on localhost:3000
#   4. Adds HSTS + security headers
#
# Setup:
#   1. Copy this file to /etc/nginx/sites-available/rizqun
#   2. Replace YOUR_DOMAIN with your actual domain (e.g. rizqun.com)
#   3. Replace /var/www/rizqun-ui with your frontend build path
#   4. ln -s /etc/nginx/sites-available/rizqun /etc/nginx/sites-enabled/
#   5. certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
#   6. nginx -t && systemctl reload nginx
#
# Certbot will automatically modify this file to add the SSL certificate lines.

# ─── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt challenge path (certbot will verify via this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ─── SSL certificate (filled by certbot) ───────────────────
    # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ─── SSL settings ──────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── HSTS (1 year, include subdomains, preload) ────────────
    # Only enable after you're sure HTTPS works (it's permanent for 1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Security headers (complement to Helmet) ───────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Frontend static files ─────────────────────────────────
    root /var/www/rizqun-ui;
    index index.html;

    # SPA fallback: try static files first, then fall back to index.html
    # (so React Router can handle client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API reverse proxy ─────────────────────────────────────
    # All backend routes proxied to Node.js on localhost:3000
    location /auth/        { proxy_pass http://127.0.0.1:3000; }
    location /vendors/     { proxy_pass http://127.0.0.1:3000; }
    location /products/    { proxy_pass http://127.0.0.1:3000; }
    location /orders/      { proxy_pass http://127.0.0.1:3000; }
    location /ratings/     { proxy_pass http://127.0.0.1:3000; }
    location /users/       { proxy_pass http://127.0.0.1:3000; }
    location /categories/  { proxy_pass http://127.0.0.1:3000; }
    location /dashboard/   { proxy_pass http://127.0.0.1:3000; }
    location /health       { proxy_pass http://127.0.0.1:3000; }

    # ─── Proxy settings ─────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for future real-time features)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts (generous for dashboard queries)
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Body size limit (generous for large orders)
    client_max_body_size 2m;

    # ─── Static file caching ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Gzip compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
